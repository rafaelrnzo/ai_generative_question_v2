variables:
  REPOSITORY: "registry.falahtech.com/ai-generative"
  TAG_COMMIT: "$REPOSITORY/$CI_PROJECT_NAME:$CI_COMMIT_SHORT_SHA"
  TAG_LATEST: "$REPOSITORY/$CI_PROJECT_NAME:latest"
  DOCKERUSER: "admin"
  DOCKERPASSWORD: "Falah0918PRGM"
  GIT_DEPTH: "0"
  FLUX_HTTPS_URL: "https://wussh:$GIT_TOKEN@github.com/wussh/flux-new.git"
  SONAR_TOKEN: "sqp_c603f9ae5f2214410bf0da36c4f0e08501bda0b9"
  SONAR_HOST_URL: "http://10.70.0.28:9000"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  SSHUSER: "softwaredev"
  SSHPASS: "Falah0918"
  SSHSERVER: "192.168.100.3"
  BASE_DIR: "/home/softwaredev/staging/ai-generative-question/app"
  BRANCH: "$CI_COMMIT_REF_NAME"
  DOCKER_COMMAND: "docker compose up -d"
  # BuildKit Remote Configuration
  BUILDKIT_HOST: "tcp://buildkit-tfy-buildkitd-service.internal.svc.cluster.local:1234"

stages:
  - build
  - deploy

build:
  stage: build
  image: moby/buildkit:latest
  before_script:
    # Setup Docker authentication
    - mkdir -p ~/.docker
    - |
      echo "{
        \"auths\": {
          \"${REPOSITORY}\": {
            \"auth\": \"$(printf "%s:%s" "${DOCKERUSER}" "${DOCKERPASSWORD}" | base64 | tr -d '\n')\"
          }
        }
      }" > ~/.docker/config.json
  script:
    - |
      buildctl build \
        --frontend dockerfile.v0 \
        --local context=./app/ \
        --local dockerfile=./app/ \
        --opt filename=Dockerfile \
        --output type=image,name="${TAG_COMMIT}",push=true,compression=zstd,compression-level=6,force-compression=true,registry.insecure=true \
        --output type=image,name="${TAG_LATEST}",push=true,compression=zstd,compression-level=6,force-compression=true,registry.insecure=true
  only:
    - neo4j_version
  retry: 1

deploy_app:
  stage: deploy
  image: ringcentral/sshpass:latest
  before_script:
    - echo "Starting deployment..."
  script:
    - sshpass -e ssh -o StrictHostKeyChecking=no "$SSHUSER@$SSHSERVER" "
        cd $BASE_DIR &&
        git fetch origin $BRANCH &&
        git reset --hard origin/$BRANCH &&
        git pull &&
        $DOCKER_COMMAND &&
        echo 'Deployment of ai generative question staging completed.'
      "
  only:
    - neo4j_version